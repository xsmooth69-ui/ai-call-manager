<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Call Manager</title>
<meta name="theme-color" content="#0f1630">
<link rel="manifest" href="manifest.json">

<style>
:root{--bg:#0b1026;--card:#151c3a;--tx:#eef0ff;--mu:#a9b0d6;--ac:#8b6cff;--bd:#2a3366;--ok:#34d399;--wr:#fbbf24;--er:#f87171;color-scheme:dark}
[data-t=light]{--bg:#f3f4ff;--card:#fff;--tx:#14183a;--mu:#555b85;--ac:#5b3fe0;--bd:#d9dcf3;--ok:#047857;--wr:#92400e;--er:#b91c1c;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.5 system-ui,"Noto Sans Gujarati","Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--tx);padding:0 0 88px}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--bd)}
.lg{flex:1;display:flex;gap:8px;align-items:center;font-size:18px}.lg i{font-style:normal;background:var(--ac);border-radius:12px;padding:4px 8px}
main{padding:14px;max-width:640px;margin:auto}
h2{margin:6px 0 12px;font-size:22px}h3{margin:16px 0 8px;font-size:16px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
label{display:block;margin:10px 0;font-size:14px;color:var(--mu)}
input,select,textarea{width:100%;min-height:48px;margin-top:4px;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:96px}
button,.b,.g{min-height:48px;padding:10px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.b{background:var(--ac);border-color:var(--ac);color:#fff}.dg{border-color:var(--er);color:var(--er)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1 1 140px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card b{font-size:30px;display:block}
.mu{color:var(--mu);font-size:14px}.pre{white-space:pre-line}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;border:1px solid currentColor}
.p0{color:var(--mu)}.p1{color:var(--wr)}.p2{color:var(--er)}.ok{color:var(--ok)}
.lk{width:100%;justify-content:flex-start;margin-bottom:10px;font-size:17px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;flex-direction:column;gap:0;border:0;border-radius:0;background:none;font-size:12px;min-height:60px;color:var(--mu)}
nav button span{font-size:22px}nav .on{color:var(--ac)}
dialog{width:min(92vw,560px);border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);padding:16px;max-height:90vh}
dialog::backdrop{background:#000a}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="lg"><i>📞</i><b>AI Call Manager</b></div>
  <select id="hl" aria-label="Language" style="width:auto;margin:0"><option value="gu">ગુજરાતી</option><option value="hi">हिन्दी</option><option value="en">English</option></select>
  <button id="th" data-a="theme" aria-label="Theme" style="min-height:44px;padding:6px 12px">🌓</button>
</header>
<main id="v"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

home(){const rec=[...S.callers].sort((a,b)=>(b.c||0)-(a.c||0)).slice(0,5);
 return `<form id="hsf"><input name="q" type="search" placeholder="${t('search')}" aria-label="${t('search')}"></form>
 <div class="stats" style="margin-top:12px"><div class="card"><b>${S.callers.length}</b>${t('total')}</div><div class="card"><b class="${dueN()?'p2':''}">${dueN()}</b>${t('due')}</div></div>
 <button class="b" style="width:100%" data-a="add">${t('quick')}</button>
 <h3>${t('recent')}</h3>${rec.length?rec.map(c=>`<div class="card"><b>${esc(c.n)}</b> <span class="mu">${fmt(c.at)}</span><div>${esc(c.r)}</div><div class="mu">${esc(c.no)}</div></div>`).join(''):empty()}`},
callers(){const k=q.toLowerCase(),list=S.callers.filter(c=>!k||[c.n,c.ph,c.r,c.no].join(' ').toLowerCase().includes(k)).sort((a,b)=>new Date(b.at)-new Date(a.at));
 return `<h2>${t('callers')}</h2><input id="cs" type="search" value="${esc(q)}" placeholder="${t('search')}" aria-label="${t('search')}"><button class="b" style="width:100%;margin:10px 0" data-a="add">${t('quick')}</button>${list.length?list.map(card).join(''):empty()}`},
reply(){return `<h2>💬 ${t('reply')}</h2><p class="mu">${t('local')}</p><form id="rf" class="card">
 <label>${t('sit')}<select name="rs">${opts(['un','la','ms','cb','uk','bz'],'un',v=>t(v))}</select></label>${toneSel('rt')}${langSel('rl')}
 <button class="b" style="width:100%" data-a="gen" type="button">${t('gen')}</button>
 <textarea id="ro" style="margin-top:12px" aria-label="${t('reply')}"></textarea>
 <div class="row"><button type="button" data-a="copy" data-t="ro">📋 ${t('copy')}</button><button type="button" data-a="clear">${t('clear')}</button>
 ${'speechSynthesis' in window?`<button type="button" data-a="speak">${t('speak')}</button>`:''}${SR?`<button type="button" data-a="mic">${t('mic')}</button>`:''}</div>
 ${SR?`<p class="mu">${t('micInfo')}</p>`:''}</form>`},
follow(){const o=S.fu.filter(f=>!f.done).sort((a,b)=>new Date(a.at)-new Date(b.at)),now=new Date(),od=o.filter(f=>new Date(f.at)<=now),up=o.filter(f=>new Date(f.at)>now),dn=S.fu.filter(f=>f.done);
 return `<h2>⏰ ${t('follow')}</h2><form id="ff" class="card"><label>${t('fuNote')}<input name="note" maxlength="300" required></label>
 <label>${t('fuAt')}<input type="datetime-local" name="at" value="${loc(new Date(Date.now()+36e5))}" required></label>
 <label>${t('fuCaller')}<select name="cid"><option value="">—</option>${S.callers.map(c=>`<option value="${esc(c.id)}">${esc(c.n)}</option>`).join('')}</select></label>
 <button class="b" style="width:100%">${t('fuAdd')}</button></form>
 ${'Notification' in window?`<button style="width:100%" data-a="notif">🔔 ${t('notif')}</button><p class="mu">${t('notifInfo')}</p>`:''}
 <h3>${t('over')}</h3>${od.length?od.map(fuCard).join(''):empty()}<h3>${t('upc')}</h3>${up.length?up.map(fuCard).join(''):empty()}
 ${dn.length?`<h3>${t('fin')}</h3>${dn.map(fuCard).join('')}`:''}`},
more(){return `<h2>${t('more')}</h2>`+[['missed','📩'],['auto','🤖'],['priv','🔒']].map(([k,i])=>`<button class="card lk" data-a="go" data-v="${k}">${i} ${t(k)}</button>`).join('')},
missed(){return `<h2>📩 ${t('missed')}</h2><p class="mu">${t('missedInfo')}</p><form id="mf" class="card">
 <label>${t('pick')}<select name="cid"><option value="">${t('other')}</option>${S.callers.map(c=>`<option value="${esc(c.id)}">${esc(c.n)}</option>`).join('')}</select></label>
 <label>${t('name')}<input name="mn" maxlength="80"></label><label>${t('phone')}<input name="mp" type="tel" maxlength="20"></label>
 <label>${t('msg')}<select name="ms">${opts(['un','cb','ms','la'],'un',v=>t(v))}</select></label>${toneSel('mt')}${langSel('ml')}
 <textarea id="mo" aria-label="${t('msg')}"></textarea>
 <div class="row"><button type="button" data-a="copy" data-t="mo">📋 ${t('copy')}</button><a class="g" id="sms" href="#">💬 ${t('sms')}</a><a class="g" id="wa" target="_blank" rel="noopener" href="#">🟢 ${t('wa')}</a>
 <a class="g" id="tel" href="#">📞 ${t('callb')}</a><button type="button" data-a="mfu">⏰ ${t('addFu')}</button></div></form>`},
auto(){return `<h2>🤖 ${t('auto')}</h2><div class="card"><div class="mu">${t('autoSt')}</div><p><span class="pill p2">⛔ ${t('unav')}</span></p><p>${t('autoWhy')}</p>
 <button class="b" style="width:100%" data-a="explore">${t('explore')}</button><p id="ex" class="pre" hidden>${t('exploreInfo')}</p></div>
 <button style="width:100%" data-a="go" data-v="missed">📩 ${t('missed')}</button>`},
priv(){return `<h2>🔒 ${t('priv')}</h2><div class="card"><p>${t('privInfo')}</p>
 <div class="row"><button data-a="exp">⬇ ${t('exp')}</button><button data-a="imp">⬆ ${t('imp')}</button><button class="dg" data-a="wipe">🗑 ${t('wipe')}</button></div>
 <input type="file" id="fi" accept="application/json,.json" hidden></div>`}
};

/* ================= Render ================= */
const NAV=[['home','🏠'],['callers','👥'],['reply','💬'],['follow','⏰'],['more','⋯']];
function render(){
 document.documentElement.dataset.t=S.theme; document.documentElement.lang=S.lang; $('#hl').value=S.lang;
 $('#nav').innerHTML=NAV.map(([k,i])=>`<button data-a="go" data-v="${k}" class="${view===k||(k==='more'&&['missed','auto','priv'].includes(view))?'on':''}"><span>${i}</span>${t(k)}</button>`).join('');
 $('#v').innerHTML=V[view](); if(view==='missed')mm();
}

/* ================= Caller form (dialog) ================= */
function openC(id){const c=S.callers.find(x=>x.id===id)||{};
 $('#dlg').innerHTML=`<form id="cf" data-id="${esc(id||'')}"><h2>${t(id?'edit':'quick').replace('+ ','')}</h2>
 <label>${t('name')} *<input name="n" required maxlength="80" value="${esc(c.n)}"></label>
 <label>${t('phone')}<input name="ph" type="tel" maxlength="20" value="${esc(c.ph)}"></label>
 <label>${t('when')}<input name="at" type="datetime-local" value="${esc(c.at||loc(new Date()))}"></label>
 <label>${t('reason')}<input name="r" maxlength="200" value="${esc(c.r)}"></label>
 <label>${t('prio')}<select name="p">${[0,1,2].map(i=>`<option value="${i}" ${(c.p||0)===i?'selected':''}>${t('p'+i)}</option>`).join('')}</select></label>
 <label>${t('notes')}<textarea name="no" maxlength="1000">${esc(c.no)}</textarea></label>
 <p class="mu">🔒 ${t('sens')}</p>
 <div class="row"><button type="button" data-a="cancel">${t('cancel')}</button><button class="b">${t('save')}</button></div></form>`;
 $('#dlg').showModal();
}

/* ================= Missed-call generator ================= */
function mm(e){const f=$('#mf'); if(!f)return;
 if(e&&e.target.name==='cid'){const c=S.callers.find(x=>x.id===f.cid.value); if(c){f.mn.value=c.n;f.mp.value=c.ph||''}}
 const txt=gen(f.ms.value,f.mt.value,f.ml.value,f.mn.value.trim()), ph=f.mp.value.replace(/[^\d+]/g,''), dg=ph.replace(/\D/g,'');
 $('#mo').value=txt; $('#sms').href=ph?`sms:${ph}?body=${encodeURIComponent(txt)}`:'#';
 $('#wa').href=`https://wa.me/${dg}?text=${encodeURIComponent(txt)}`; $('#tel').href=ph?`tel:${ph}`:'#';
}

/* ================= Actions ================= */
const A={
 go(b){view=b.dataset.v;q='';render();scrollTo(0,0)},
 theme(){S.theme=S.theme==='dark'?'light':'dark';save();render()},
 add(){openC()}, edit(b){openC(b.dataset.i)}, cancel(){$('#dlg').close()},
 del(b){if(confirm(t('delQ'))){S.callers=S.callers.filter(c=>c.id!==b.dataset.i);save();render()}},
 fdone(b){const f=S.fu.find(x=>x.id===b.dataset.i);if(f){f.done=true;save();render()}},
 fdel(b){if(confirm(t('delQ'))){S.fu=S.fu.filter(x=>x.id!==b.dataset.i);save();render()}},
 gen(){const f=$('#rf');$('#ro').value=gen(f.rs.value,f.rt.value,f.rl.value,'')},
 copy(b){cp($('#'+b.dataset.t).value)}, clear(){$('#ro').value=''},
 speak(){const x=$('#ro').value.trim();if(!x)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);u.lang=SPEECH[$('#rl').value];speechSynthesis.speak(u)},
 mic(){ // microphone is touched only after this explicit tap
  try{const r=new SR();r.lang=SPEECH[$('#rl').value];r.onresult=ev=>{const o=$('#ro');o.value+=(o.value?' ':'')+ev.results[0][0].transcript};r.onerror=()=>toast('🎤 ✖');r.start()}catch(e){toast('🎤 ✖')}},
 notif(){Notification.requestPermission().then(p=>toast('🔔 '+p))},
 explore(){const e=$('#ex');e.hidden=!e.hidden},
 mfu(){const f=$('#mf'),n=f.mn.value.trim()||f.mp.value.trim();
  S.fu.push({id:uid(),at:loc(new Date(Date.now()+36e5)),note:'📞 '+n,cid:f.cid.value,done:false});if(save()){toast(t('ok'))}},
 exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'acm',v:1,callers:S.callers,fu:S.fu},null,2)],{type:'application/json'}));
  a.download='ai-call-manager-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)},
 imp(){$('#fi').click()},
 wipe(){if(confirm(t('wipeQ'))&&confirm(t('wipeQ2'))){S.callers=[];S.fu=[];save();render();toast(t('ok'))}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b)});

document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id==='hsf'){q=f.q.value;view='callers';render()}
 else if(f.id==='cf'){
  const n=f.n.value.trim(),ph=f.ph.value.trim(),at=f.at.value,txt=f.r.value+' '+f.no.value;
  if(!n)return toast(t('req'));
  if(ph&&(!/^\+?[\d\s()-]{5,20}$/.test(ph)||ph.replace(/\D/g,'').length<5))return toast(t('badPh'));
  if(at&&isNaN(new Date(at)))return toast(t('badDt'));
  if(/\b(otp|password|passcode|cvv|pin)\b/i.test(txt))return toast(t('sens')); // block sensitive data
  const rec={id:f.dataset.id||uid(),n,ph,at:at||loc(new Date()),r:f.r.value.trim(),p:+f.p.value,no:f.no.value.trim(),c:Date.now()};
  const i=S.callers.findIndex(x=>x.id===rec.id); if(i>=0){rec.c=S.callers[i].c;S.callers[i]=rec}else S.callers.push(rec);
  if(save()){$('#dlg').close();render()}
 }else if(f.id==='ff'){
  const note=f.note.value.trim(); if(!note||isNaN(new Date(f.at.value)))return toast(t('noFu'));
  S.fu.push({id:uid(),at:f.at.value,note,cid:f.cid.value,done:false});if(save())render();
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='cs'){q=e.target.value;const p=e.target.selectionStart;render();const s=$('#cs');s.focus();s.setSelectionRange(p,p)}
 else if(e.target.closest('#mf'))mm(e);
});
document.addEventListener('change',e=>{
 if(e.target.id==='hl'){S.lang=e.target.value;save();render()}
 else if(e.target.closest('#mf'))mm(e);
 else if(e.target.id==='fi'&&e.target.files[0]){importFile(e.target.files[0]);e.target.value=''}
});

/* ================= Import with validation ================= */
function importFile(file){const r=new FileReader();r.onload=()=>{try{
 const d=JSON.parse(r.result); if(!d||d.app!=='acm'||!Array.isArray(d.callers)||!Array.isArray(d.fu))throw 0;
 const cs=d.callers.map(c=>{if(!c||typeof c.n!=='string'||!c.n.trim())throw 0;return{id:String(c.id||uid()),n:c.n.slice(0,80),ph:String(c.ph||'').slice(0,20),at:String(c.at||'').slice(0,16),r:String(c.r||'').slice(0,200),p:[0,1,2].includes(+c.p)?+c.p:0,no:String(c.no||'').slice(0,1000),c:+c.c||Date.now()}});
 const fs=d.fu.map(f=>{if(!f||typeof f.note!=='string'||isNaN(new Date(f.at)))throw 0;return{id:String(f.id||uid()),at:String(f.at).slice(0,16),note:f.note.slice(0,300),cid:String(f.cid||''),done:!!f.done}});
 if(!confirm(t('impQ')))return; S.callers=cs;S.fu=fs;save();render();toast(t('ok'));
}catch(e){toast(t('bad'))}};r.readAsText(file)}

/* ================= Due follow-up notifications (only while the app is open) ================= */
setInterval(()=>{let ch=0;S.fu.forEach(f=>{if(!f.done&&!f.nf&&new Date(f.at)<=Date.now()){f.nf=1;ch=1;
 if('Notification' in window&&Notification.permission==='granted'){
  if(navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification('AI Call Manager',{body:f.note})).catch(()=>{});
  else try{new Notification('AI Call Manager',{body:f.note})}catch(e){}}}});
 if(ch){save();if(view==='home')render()}},30000);

/* ================= Start ================= */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))
 window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
